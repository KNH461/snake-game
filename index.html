<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 小游戏合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#eee;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-size:2.2rem;margin-bottom:8px;text-shadow:0 0 20px rgba(0,255,0,0.4)}
.sub{color:#888;font-size:0.95rem;margin-bottom:40px}
.games{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;max-width:700px}
.game-card{
  width:280px;background:rgba(0,255,0,0.04);border:1px solid rgba(0,255,0,0.2);
  border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;
  transition:all 0.2s;text-decoration:none;color:#eee;display:block;
}
.game-card:hover{transform:translateY(-4px);border-color:#0f0;box-shadow:0 8px 30px rgba(0,255,0,0.15)}
.game-card .icon{font-size:4rem;margin-bottom:12px;display:block}
.game-card h2{font-size:1.3rem;margin-bottom:8px;color:#0f0}
.game-card p{font-size:0.85rem;color:#888;line-height:1.5}
.footer{margin-top:auto;padding-top:40px;color:#444;font-size:0.8rem}
</style>
</head>
<body>
<h1>🎮 小游戏合集</h1>
<p class="sub">和朋友们一起比拼吧</p>
<div class="games">
  <a class="game-card" href="snake.html">
    <span class="icon">🐍</span>
    <h2>贪吃蛇</h2>
    <p>经典贪吃蛇，吃食物长长身体<br>支持键盘、触屏和虚拟按钮</p>
  </a>
  <a class="game-card" href="tetris.html">
    <span class="icon">🧱</span>
    <h2>俄罗斯方块</h2>
    <p>经典方块消除，挑战你的极限<br>支持键盘和触屏操作</p>
  </a>
</div>
<p class="footer">Made with ❤️</p>
</body>
</html>
