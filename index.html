<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  color: #eee;
  overflow: hidden;
  touch-action: none;
}
h1 {
  font-size: 1.6rem;
  margin-bottom: 8px;
  text-shadow: 0 0 10px #0f0;
}
.score-bar {
  display: flex;
  gap: 24px;
  margin-bottom: 10px;
  font-size: 1rem;
}
.score-bar span { color: #0f0; font-weight: bold; }
canvas {
  border: 2px solid #0f0;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(0,255,0,0.2);
  background: #16213e;
}
.controls {
  display: none;
  margin-top: 16px;
  gap: 4px;
}
.controls button {
  width: 60px; height: 60px;
  font-size: 1.5rem;
  border: 1px solid #0f0;
  background: rgba(0,255,0,0.1);
  color: #0f0;
  border-radius: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.controls button:active { background: rgba(0,255,0,0.3); }
.btn-row { display: flex; gap: 4px; justify-content: center; }
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
.overlay h2 { font-size: 2rem; margin-bottom: 12px; }
.overlay p { font-size: 1.1rem; margin-bottom: 20px; color: #aaa; }
.overlay button {
  padding: 12px 36px;
  font-size: 1.1rem;
  border: 2px solid #0f0;
  background: transparent;
  color: #0f0;
  border-radius: 8px;
  cursor: pointer;
}
.overlay button:hover { background: rgba(0,255,0,0.15); }
@media (pointer: coarse) { .controls { display: flex; flex-direction: column; align-items: center; } }
@media (max-width: 420px) {
  canvas { width: 95vw !important; height: 95vw !important; }
}
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>
<div class="score-bar">
  得分: <span id="score">0</span>
  &nbsp;|&nbsp;
  最高: <span id="best">0</span>
</div>
<canvas id="game" width="400" height="400"></canvas>

<div class="controls" id="controls">
  <div class="btn-row">
    <button id="btnU">⬆️</button>
  </div>
  <div class="btn-row">
    <button id="btnL">⬅️</button>
    <button id="btnD">⬇️</button>
    <button id="btnR">➡️</button>
  </div>
</div>

<div class="overlay" id="startScreen">
  <h2>🐍 贪吃蛇</h2>
  <p>方向键 / WASD / 滑动 / 按钮控制</p>
  <button onclick="startGame()">开始游戏</button>
</div>

<div class="overlay" id="gameOverScreen" style="display:none">
  <h2>💀 游戏结束</h2>
  <p>得分: <span id="finalScore">0</span></p>
  <button onclick="startGame()">再来一局</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best = 0, speed, loop, alive;

function init() {
  snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  score = 0;
  speed = 130;
  alive = true;
  placeFood();
  document.getElementById('score').textContent = 0;
}

function placeFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function draw() {
  // background
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid dots (subtle)
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      ctx.fillRect(x*GRID+1, y*GRID+1, GRID-2, GRID-2);

  // food
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(food.x*GRID+GRID/2, food.y*GRID+GRID/2, GRID/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((seg, i) => {
    const ratio = 1 - i / snake.length;
    const g = Math.floor(200 + 55 * ratio);
    ctx.fillStyle = i === 0 ? '#0f0' : `rgb(0,${g},0)`;
    ctx.shadowColor = i === 0 ? '#0f0' : 'transparent';
    ctx.shadowBlur = i === 0 ? 6 : 0;
    ctx.fillRect(seg.x*GRID+1, seg.y*GRID+1, GRID-2, GRID-2);
    ctx.shadowBlur = 0;
  });
}

function update() {
  if (!alive) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    if (score > best) { best = score; document.getElementById('best').textContent = best; }
    placeFood();
    // speed up slightly
    if (speed > 60) { speed -= 2; clearInterval(loop); loop = setInterval(tick, speed); }
  } else {
    snake.pop();
  }
}

function tick() { update(); draw(); }

function die() {
  alive = false;
  clearInterval(loop);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  init();
  draw();
  clearInterval(loop);
  loop = setInterval(tick, speed);
}

// keyboard
document.addEventListener('keydown', e => {
  const map = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
  };
  if (map[e.key]) {
    const nd = map[e.key];
    if (nd.x + dir.x !== 0 || nd.y + dir.y !== 0) nextDir = nd;
    e.preventDefault();
  }
});

// touch swipe
let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  else nd = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  if (nd.x + dir.x !== 0 || nd.y + dir.y !== 0) nextDir = nd;
}, {passive:true});

// mobile buttons
const btnMap = {btnU:{x:0,y:-1}, btnD:{x:0,y:1}, btnL:{x:-1,y:0}, btnR:{x:1,y:0}};
Object.entries(btnMap).forEach(([id, nd]) => {
  document.getElementById(id).addEventListener('pointerdown', e => {
    if (nd.x + dir.x !== 0 || nd.y + dir.y !== 0) nextDir = nd;
    e.preventDefault();
  });
});

// initial draw
init(); draw();
</script>
</body>
</html>
