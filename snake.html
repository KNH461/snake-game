<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#eee;overflow-x:hidden;touch-action:none;padding:12px}
.back{align-self:flex-start;margin-bottom:8px}
.back a{color:#1a1a2e;background:#0f0;padding:6px 16px;border-radius:6px;text-decoration:none;font-size:0.9rem;font-weight:bold;display:inline-block}
.back a:hover{background:#0c0}
.header{text-align:center;margin-bottom:8px}
.header h1{font-size:1.6rem;text-shadow:0 0 10px #0f0}
.score-bar{display:flex;gap:16px;margin-bottom:10px;font-size:0.95rem;justify-content:center;flex-wrap:wrap}
.score-bar span{color:#0f0;font-weight:bold}
.multiplier{color:#ffd700!important;font-size:1.1rem}
.main-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
canvas{border:2px solid #0f0;border-radius:4px;box-shadow:0 0 20px rgba(0,255,0,0.2);background:#16213e;flex-shrink:0}
.leaderboard{background:rgba(0,255,0,0.05);border:1px solid rgba(0,255,0,0.3);border-radius:8px;padding:14px;min-width:220px;max-width:280px}
.leaderboard h3{font-size:1.1rem;margin-bottom:10px;color:#0f0;text-align:center}
.lb-list{list-style:none;max-height:360px;overflow-y:auto}
.lb-list li{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.9rem}
.lb-list li:first-child{color:#ffd700;font-weight:bold}
.lb-list li:nth-child(2){color:#c0c0c0}
.lb-list li:nth-child(3){color:#cd7f32}
.lb-rank{width:28px;text-align:center}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px}
.lb-score{font-weight:bold;color:#0f0;min-width:32px;text-align:right}
.lb-status{text-align:center;font-size:0.75rem;color:#666;margin-top:8px}
.lb-status.online{color:#0f0}
.controls{display:none;margin-top:12px;gap:4px}
.controls button{width:60px;height:60px;font-size:1.5rem;border:1px solid #0f0;background:rgba(0,255,0,0.1);color:#0f0;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.controls button:active{background:rgba(0,255,0,0.3)}
.btn-row{display:flex;gap:4px;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;overflow-y:auto;padding:20px 10px}
.overlay h2{font-size:2rem;margin-bottom:12px}
.overlay p{font-size:1rem;margin-bottom:16px;color:#aaa}
.overlay input{padding:10px 16px;font-size:1.1rem;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:8px;outline:none;width:200px;text-align:center;margin-bottom:12px}
.overlay input::placeholder{color:rgba(0,255,0,0.3)}
.overlay button{padding:12px 36px;font-size:1.1rem;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:8px;cursor:pointer;margin:4px}
.overlay button:hover{background:rgba(0,255,0,0.15)}
.overlay .sub{font-size:0.85rem;color:#666;margin-top:8px}
#gameOverScreen .rank-info{font-size:1.2rem;color:#0f0;margin-bottom:12px}
.speed-select{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.speed-btn{padding:8px 18px;font-size:0.95rem;border:2px solid rgba(0,255,0,0.4);background:transparent;color:#0f0;border-radius:8px;cursor:pointer;transition:all 0.2s}
.speed-btn.active{background:rgba(0,255,0,0.2);border-color:#0f0;box-shadow:0 0 10px rgba(0,255,0,0.3)}
.speed-btn:hover{background:rgba(0,255,0,0.1)}
.speed-info{font-size:0.8rem;color:#888;margin-bottom:12px}
.overlay-lb{width:100%;max-width:340px;margin-top:16px}
.overlay-lb h3{color:#0f0;font-size:1rem;margin-bottom:8px;text-align:center}
.overlay-lb .lb-list{max-height:240px}
.show-lb-btn{font-size:0.85rem!important;padding:8px 20px!important;border-color:rgba(0,255,0,0.4)!important;color:rgba(0,255,0,0.7)!important;margin-top:12px!important}
@media(pointer:coarse){.controls{display:flex;flex-direction:column;align-items:center}}
@media(max-width:600px){
  .main-wrap{flex-direction:column;align-items:center}
  canvas{width:90vw!important;height:90vw!important}
  .leaderboard{width:90vw;max-width:none}
  .score-bar{font-size:0.85rem;gap:10px}
}
</style>
</head>
<body>
<div class="back"><a href="index.html">← 返回游戏列表</a></div>

<div class="header">
  <h1>🐍 贪吃蛇</h1>
  <div class="score-bar">
    得分: <span id="score">0</span>
    &nbsp;|&nbsp;
    倍率: <span id="mult" class="multiplier">x1.0</span>
    &nbsp;|&nbsp;
    最高: <span id="best">0</span>
  </div>
</div>

<div class="main-wrap">
  <div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls" id="controls">
      <div class="btn-row"><button id="btnU">⬆️</button></div>
      <div class="btn-row">
        <button id="btnL">⬅️</button>
        <button id="btnD">⬇️</button>
        <button id="btnR">➡️</button>
      </div>
    </div>
  </div>
  <div class="leaderboard" id="leaderboard">
    <h3>🏆 排行榜</h3>
    <ul class="lb-list" id="lbList"><li style="justify-content:center;color:#666">加载中...</li></ul>
    <div class="lb-status" id="lbStatus">等待连接...</div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <h2>🐍 贪吃蛇</h2>
  <p>输入昵称，选择速度开始</p>
  <input type="text" id="nicknameInput" placeholder="你的昵称" maxlength="12" autocomplete="off">
  <div class="speed-select" id="speedSelect">
    <button class="speed-btn" data-speed="slow">🐢 慢速</button>
    <button class="speed-btn active" data-speed="normal">🏃 普通</button>
    <button class="speed-btn" data-speed="fast">🚀 快速</button>
    <button class="speed-btn" data-speed="insane">⚡ 极速</button>
  </div>
  <div class="speed-info" id="speedInfo">基础倍率 x1.5 · 每吃一个 +0.2</div>
  <button onclick="startGame()">开始游戏</button>
  <div class="sub">方向键 / WASD / 滑动 / 按钮控制</div>
  <button class="show-lb-btn" onclick="toggleOverlayLB()">🏆 查看排行榜</button>
  <div class="overlay-lb" id="overlayLB" style="display:none">
    <ul class="lb-list" id="overlayLBList"><li style="justify-content:center;color:#666">加载中...</li></ul>
  </div>
</div>

<div class="overlay" id="gameOverScreen" style="display:none">
  <h2>💀 游戏结束</h2>
  <p>得分: <span id="finalScore">0</span></p>
  <div class="rank-info" id="rankInfo"></div>
  <button onclick="startGame()">再来一局</button>
</div>

<script>
const API_KEY = '$2a$10$JDS9gl1LtJJ1GfLQy013YOEMq8xzl5QLHxoKGghwH7uIRxVbZQZNi';
const BIN_ID = '6a1b0396ddf5aa59f778b27f';
const API_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
const REFRESH_INTERVAL = 30000;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

// Speed configurations: { interval, baseMultiplier, label }
const SPEEDS = {
  slow:   { interval: 150, baseMult: 1.0, label: '🐢 慢速',  info: '基础倍率 x1.0 · 每吃一个 +0.2' },
  normal: { interval: 110, baseMult: 1.5, label: '🏃 普通',  info: '基础倍率 x1.5 · 每吃一个 +0.2' },
  fast:   { interval: 75,  baseMult: 2.5, label: '🚀 快速',  info: '基础倍率 x2.5 · 每吃一个 +0.2' },
  insane: { interval: 50,  baseMult: 4.0, label: '⚡ 极速',  info: '基础倍率 x4.0 · 每吃一个 +0.2' },
};

let selectedSpeed = 'normal';
let snake, dir, nextDir, food, score, speed, loop, alive;
let currentMult, foodEaten;
let nickname = localStorage.getItem('snake_nick') || '';
let localBest = parseInt(localStorage.getItem('snake_best') || '0');
const nickInput = document.getElementById('nicknameInput');
if (nickname) nickInput.value = nickname;
document.getElementById('best').textContent = localBest;

// Speed selection UI
const speedBtns = document.querySelectorAll('.speed-btn');
speedBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSpeed = btn.dataset.speed;
    document.getElementById('speedInfo').textContent = SPEEDS[selectedSpeed].info;
  });
});

function init(){
  snake=[{x:Math.floor(COLS/2),y:Math.floor(ROWS/2)}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;foodEaten=0;
  const cfg = SPEEDS[selectedSpeed];
  speed = cfg.interval;
  currentMult = cfg.baseMult;
  alive=true;
  placeFood();
  document.getElementById('score').textContent=0;
  document.getElementById('mult').textContent='x'+currentMult.toFixed(1);
}

function placeFood(){let p;do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p;}

function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(255,255,255,0.03)';for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)ctx.fillRect(x*GRID+1,y*GRID+1,GRID-2,GRID-2);
  ctx.fillStyle='#ff6b6b';ctx.shadowColor='#ff6b6b';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(food.x*GRID+GRID/2,food.y*GRID+GRID/2,GRID/2-2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  snake.forEach((seg,i)=>{
    const r=1-i/snake.length;const g=Math.floor(200+55*r);
    ctx.fillStyle=i===0?'#0f0':`rgb(0,${g},0)`;
    ctx.shadowColor=i===0?'#0f0':'transparent';ctx.shadowBlur=i===0?6:0;
    ctx.fillRect(seg.x*GRID+1,seg.y*GRID+1,GRID-2,GRID-2);ctx.shadowBlur=0;
  });
}

function update(){
  if(!alive)return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS)return die();
  if(snake.some(s=>s.x===head.x&&s.y===head.y))return die();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    foodEaten++;
    // Score: round up to integer, each food gives currentMult points
    const pts = Math.ceil(currentMult);
    score += pts;
    // Increase multiplier by 0.2 after each food
    currentMult += 0.2;
    document.getElementById('score').textContent=score;
    document.getElementById('mult').textContent='x'+currentMult.toFixed(1);
    placeFood();
    // Speed still increases slightly as you eat (optional subtle speedup)
    if(speed>40){speed-=1;clearInterval(loop);loop=setInterval(tick,speed);}
  }else snake.pop();
}

function tick(){update();draw();}

function die(){
  alive=false;clearInterval(loop);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('gameOverScreen').style.display='flex';
  if(score>localBest){localBest=score;localStorage.setItem('snake_best',localBest);}
  document.getElementById('best').textContent=localBest;
  if(nickname&&score>0)submitScore(nickname,score);
}

function startGame(){
  nickname=nickInput.value.trim()||'匿名玩家';
  localStorage.setItem('snake_nick',nickname);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  init();draw();clearInterval(loop);loop=setInterval(tick,speed);
}

function toggleOverlayLB(){
  const lb=document.getElementById('overlayLB');
  if(lb.style.display==='none'){
    lb.style.display='block';
    // Copy leaderboard content
    document.getElementById('overlayLBList').innerHTML=document.getElementById('lbList').innerHTML;
  }else{
    lb.style.display='none';
  }
}

document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
  if(m[e.key]){const nd=m[e.key];if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;e.preventDefault();}
});
let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;let nd;if(Math.abs(dx)>Math.abs(dy))nd=dx>0?{x:1,y:0}:{x:-1,y:0};else nd=dy>0?{x:0,y:1}:{x:0,y:-1};if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;},{passive:true});
const btnMap={btnU:{x:0,y:-1},btnD:{x:0,y:1},btnL:{x:-1,y:0},btnR:{x:1,y:0}};
Object.entries(btnMap).forEach(([id,nd])=>{document.getElementById(id).addEventListener('pointerdown',e=>{if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;e.preventDefault();});});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function fetchScores(){
  try{
    const r=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});
    if(!r.ok)throw 0;
    const d=await r.json();
    renderLB(d.record.players||{});
    document.getElementById('lbStatus').textContent=`✅ 已同步 · ${new Date().toLocaleTimeString()}`;
    document.getElementById('lbStatus').className='lb-status online';
  }catch(e){
    document.getElementById('lbStatus').textContent='⚠️ 同步失败';
    document.getElementById('lbStatus').className='lb-status';
  }
}
function renderLB(p){
  const s=Object.entries(p).map(([n,d])=>({name:n,score:d.best||0})).sort((a,b)=>b.score-a.score).slice(0,20);
  const l=document.getElementById('lbList');
  if(!s.length){l.innerHTML='<li style="justify-content:center;color:#666">还没有记录，来一局吧！</li>';return;}
  l.innerHTML=s.map((p,i)=>{
    const m=['🥇','🥈','🥉'];const r=i<3?m[i]:`${i+1}`;
    const h=p.name===nickname?' style="background:rgba(0,255,0,0.08)"':'';
    return`<li${h}><span class="lb-rank">${r}</span><span class="lb-name">${esc(p.name)}</span><span class="lb-score">${p.score}</span></li>`;
  }).join('');
  // Also update overlay LB if visible
  if(document.getElementById('overlayLB').style.display!=='none'){
    document.getElementById('overlayLBList').innerHTML=l.innerHTML;
  }
}
async function submitScore(name,ns){
  document.getElementById('lbStatus').textContent='⏳ 提交中...';
  try{
    const gr=await fetch(API_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});
    const gd=await gr.json();const scores=gd.record;
    if(!scores.players)scores.players={};
    const ex=scores.players[name];const ib=!ex||ns>(ex.best||0);
    scores.players[name]={best:ib?ns:(ex.best||0),games:((ex&&ex.games)||0)+1,lastPlayed:Date.now()};
    const all=Object.values(scores.players).map(p=>p.best).sort((a,b)=>b-a);
    const rank=all.indexOf(scores.players[name].best)+1;
    document.getElementById('rankInfo').textContent=ib?`🎉 新纪录！排名第 ${rank}`:`当前排名第 ${rank}（历史最高 ${scores.players[name].best}）`;
    await fetch(API_URL,{method:'PUT',headers:{'X-Master-Key':API_KEY,'Content-Type':'application/json'},body:JSON.stringify(scores)});
    renderLB(scores.players);
    document.getElementById('lbStatus').textContent=`✅ 已提交 · ${new Date().toLocaleTimeString()}`;
  }catch(e){document.getElementById('lbStatus').textContent='⚠️ 提交失败';}
}

fetchScores();setInterval(fetchScores,REFRESH_INTERVAL);init();draw();
</script>
</body>
</html>
